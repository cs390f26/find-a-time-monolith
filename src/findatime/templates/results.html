<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Find a Time — Results</title>
<style>
  :root {
    --primary: #7a2048;
    --primary-dark: #5c1836;
    --na: #a4433a;
    --bg: #faf6f2;
    --card-bg: #ffffff;
    --border: #e8ddd6;
    --track: #efe6e0;
    --text-main: #2b2320;
    --text-muted: #8a7a72;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: linear-gradient(180deg, #faf6f2 0%, #f2e9e2 100%);
    font-family: "Helvetica Neue", Arial, sans-serif;
    color: var(--text-main);
    padding: 48px 64px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 32px;
  }

  h1 {
    font-family: Georgia, "Times New Roman", serif;
    color: var(--primary);
    font-size: 40px;
    margin: 0 0 4px 0;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 15px;
    margin: 0;
  }

  .nav {
    display: flex;
    gap: 12px;
  }

  .btn {
    display: inline-block;
    background: var(--primary);
    color: #fff;
    text-decoration: none;
    padding: 12px 22px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 14px;
    border: none;
    cursor: pointer;
  }

  .btn-secondary {
    background: transparent;
    color: var(--primary);
    border: 1px solid var(--primary);
  }

  .card {
    background: var(--card-bg);
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.05);
    padding: 40px;
    max-width: 640px;
  }

  .card h2 {
    font-family: Georgia, serif;
    font-size: 26px;
    margin: 0 0 8px 0;
  }

  .total {
    color: var(--text-muted);
    font-size: 15px;
    margin: 0 0 28px 0;
  }

  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 0 0 28px 0;
  }

  .result-row { margin-bottom: 24px; }

  .result-label {
    display: flex;
    justify-content: space-between;
    font-weight: 700;
    font-size: 16px;
    margin-bottom: 8px;
  }

  .bar-track {
    background: var(--track);
    border-radius: 999px;
    height: 14px;
    overflow: hidden;
  }

  .bar-fill {
    background: var(--primary);
    height: 100%;
    border-radius: 999px 0 0 999px;
  }

  .bar-fill.not-available {
    background: var(--na);
  }

  .attendees-list {
    margin-top: 6px;
    font-size: 13px;
    color: var(--text-muted);
  }

  .footer-link {
    display: inline-block;
    margin-top: 12px;
    color: var(--primary);
    font-weight: 600;
    text-decoration: underline;
  }
</style>
</head>
<body>

  <header>
    <div>
      <h1><a href="/" style="color:inherit;text-decoration:none">Find a Time</a></h1>
      <p class="subtitle">Propose a plan. Cast your availability. See the results.</p>
    </div>
    <div class="nav">
      <a href="/" class="btn btn-secondary">All events</a>
      <a href="/create" class="btn">Create event</a>
    </div>
  </header>

  <p class="event-meta" id="page-error" role="alert" hidden></p>

  <div class="card" id="results-card" hidden>
    <h2 id="title"></h2>
    <p class="event-meta" id="notes"></p>
    <p class="total" id="total"></p>

    <hr class="divider">

    <div id="result-list"></div>

    <hr class="divider">

    <a id="respond-link" class="footer-link">Respond or change your response</a>
  </div>

<script>
// The event id comes from the URL: /results?id=ev_123
const eventId = new URLSearchParams(window.location.search).get("id");
const pageError = document.getElementById("page-error");
const card = document.getElementById("results-card");
const resultList = document.getElementById("result-list");

function showPageError(message) {
  pageError.hidden = false;
  pageError.textContent = message;
  card.hidden = true;
}

function responsesLabel(n) {
  return n === 1 ? "1 response" : n + " responses";
}

async function loadResults() {
  if (!eventId) return showPageError("Missing event id.");

  // GET /events/<id>/results: tallies, names, and the best time(s)
  const response = await fetch("/events/" + encodeURIComponent(eventId) + "/results");
  const data = await response.json().catch(() => ({}));
  if (!response.ok) {
    return showPageError((data.error && data.error.message) || "Event not found.");
  }

  document.title = "Find a Time — Results — " + data.title;
  document.getElementById("title").textContent = data.title;
  document.getElementById("notes").textContent = data.notes || "";
  document.getElementById("total").textContent = responsesLabel(data.attendeeCount);
  document.getElementById("respond-link").href = "/respond?id=" + encodeURIComponent(eventId);

  resultList.replaceChildren();
  for (const slot of data.timeSlots) {
    const row = document.createElement("div");
    row.className = "result-row";
    row.innerHTML =
      '<div class="result-label"><span><span class="slot-name"></span></span>' +
      '<span class="result-count"></span></div>' +
      '<div class="bar-track"><div class="bar-fill"></div></div>' +
      '<div class="attendees-list"></div>';

    row.querySelector(".slot-name").textContent = slot.label;
    if (data.winningSlotIds.includes(slot.slotId)) {
      const best = document.createElement("strong");
      best.textContent = " (Best time)";
      row.querySelector(".slot-name").after(best);
    }
    row.querySelector(".result-count").textContent = slot.tally;

    // Bar width = share of all respondents who picked this slot
    const bar = row.querySelector(".bar-fill");
    if (slot.slotId === "slot_fallback") bar.classList.add("not-available");
    const percent = data.attendeeCount > 0 ? (slot.tally / data.attendeeCount) * 100 : 0;
    bar.style.width = percent + "%";

    row.querySelector(".attendees-list").textContent =
      slot.attendees.length ? slot.attendees.join(", ") : "No responses yet";
    resultList.appendChild(row);
  }
  card.hidden = false;
}

loadResults();
</script>

</body>
</html>
